  # Compiles all TS files in the monorepo
  ts-check:
    # needs: npm-install
    name: Compile source code
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [24.x]

    steps:
      - uses: actions/checkout@v5
      # pnpm, in the version of the root package.json's "packageManager"
      - uses: pnpm/action-setup@v6
        with:
          cache: true
          cache_dependency_path: |
            pnpm-lock.yaml
            source/pnpm-lock.yaml
            examples/pnpm-lock.yaml
            www/pnpm-lock.yaml
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}

      # the root's postinstall installs every folder (scripts/install-all.mjs),
      # each from its own pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Compile source code in monorepo
        run: pnpm run ci:ts-check

  run-tests:
    # needs: npm-install
    name: Run tests
    # Playwright 1.52 can't install browsers on ubuntu-26.04 (current ubuntu-latest)
    runs-on: ubuntu-24.04
    permissions:
      contents: write # Needed to push performance baseline updates
    env:
      NEXT_PUBLIC_BASE_URL: https://data.infinite-table.com
      NEXT_PUBLIC_INFINITE_LICENSE_KEY: ${{ secrets.NEXT_PUBLIC_INFINITE_LICENSE_KEY }}
    strategy:
      matrix:
        node-version: [24.x]

    steps:
      - uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      # pnpm, in the version of the root package.json's "packageManager"
      - uses: pnpm/action-setup@v6
        with:
          cache: true
          cache_dependency_path: |
            pnpm-lock.yaml
            source/pnpm-lock.yaml
            examples/pnpm-lock.yaml
            www/pnpm-lock.yaml
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}

      # the root's postinstall installs every folder (scripts/install-all.mjs),
      # each from its own pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Get installed Playwright version
        id: playwright-version
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
        working-directory: examples

      - name: Restore cached browser binaries for Playwright
        id: playwright-restore
        uses: actions/cache/restore@v5
        with:
          path: '~/.cache/ms-playwright'
          key: '${{ runner.os }}-playwright-${{ steps.playwright-version.outputs.version }}'

      - name: Install Playwright browsers
        # this will not download anything if the previous step found a cached browser binary
        run: pnpm exec playwright install chromium
        working-directory: examples
        env:
          CI: true

      - name: Install Playwright system dependencies
        # Chromium's apt packages. On the runner image its libraries are already installed and only
        # fonts are missing, and the tests do not compare screenshots, so an unreachable Ubuntu
        # mirror (a DNS outage failed two release runs) must not fail the job
        continue-on-error: true
        run: pnpm exec playwright install-deps chromium
        working-directory: examples
        env:
          CI: true

      - name: Build component # in the www folder, some CSS files are used from the source/dist folder
        run: pnpm run build

      - name: Build test app
        run: pnpm run ci:test:build
        env:
          NEXT_PUBLIC_INFINITE_LICENSE_KEY: ${{ secrets.NEXT_PUBLIC_INFINITE_LICENSE_KEY }}

      - name: Running Playwright Tests
        run: pnpm run ci:test:run
        env:
          NEXT_PUBLIC_INFINITE_LICENSE_KEY: ${{ secrets.NEXT_PUBLIC_INFINITE_LICENSE_KEY }}

      - name: Save browser binaries for Playwright
        id: playwright-save
        uses: actions/cache/save@v5
        with:
          path: '~/.cache/ms-playwright'
          key: '${{ runner.os }}-playwright-${{ steps.playwright-version.outputs.version }}'

      - name: Commit updated performance baselines
        # if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        run: |
          cd examples
          if [ -n "$(git status --porcelain perf-baselines.ci.json)" ]; then
            git config --local user.email "github-actions[bot]@users.noreply.github.com"
            git config --local user.name "github-actions[bot]"
            git add perf-baselines.ci.json
            git commit -m "chore: update CI performance baselines [skip ci]"
            git push
          else
            echo "No changes to performance baselines"
          fi
