name: 'CI: docs content'

# The docs demos and snippets (www/content) are type-checked against the
# library source and every demo has to build. Changes under source/ are
# covered by ci.yml, whose ts-check runs the same content check.
on:
  push:
    paths:
      - 'www/content/**'
      - 'www/tsconfig.json'
      - 'www/docs-kit.config.mjs'
      - 'www/docs-kit.bootstrap.ts'
      - 'www/docs-kit.tailwind.css'
      - 'www/package.json'
      - 'www/pnpm-lock.yaml'
      - '.github/workflows/www-content-check.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  content-check:
    name: Type-check and build the docs demos
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_BASE_URL: https://data.infinite-table.com
    strategy:
      matrix:
        node-version: [24.x]

    steps:
      - uses: actions/checkout@v5
      # pnpm, in the version of the root package.json's "packageManager"
      - uses: pnpm/action-setup@v6
        with:
          cache: true
          cache_dependency_path: |
            pnpm-lock.yaml
            source/pnpm-lock.yaml
            examples/pnpm-lock.yaml
            www/pnpm-lock.yaml
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}

      # the root's postinstall installs every folder (scripts/install-all.mjs),
      # each from its own pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type-check the docs demos and snippets against the source
        run: pnpm -C www run tsc:content

      - name: Build the docs demos
        run: pnpm -C www run build-demos
