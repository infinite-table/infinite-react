name: RELEASE

on:
  push:
    branches:
      - master
      - canary
      - dev
    # paths-ignore:
    #   - 'www/**'

permissions:
  id-token: write # Required for OIDC
  contents: write

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true
jobs:
  release:
    if: ${{ contains(github.event.head_commit.message, 'release version') }}
    # Playwright 1.52 can't install browsers on ubuntu-26.04 (current ubuntu-latest)
    runs-on: ubuntu-24.04
    env:
      NEXT_PUBLIC_BASE_URL: https://data.infinite-table.com

    strategy:
      matrix:
        node-version: [24.x]

    steps:
      - uses: actions/checkout@v5
      # pnpm, in the version of the root package.json's "packageManager"
      - uses: pnpm/action-setup@v6
        with:
          cache: true
          cache_dependency_path: |
            pnpm-lock.yaml
            source/pnpm-lock.yaml
            examples/pnpm-lock.yaml
            www/pnpm-lock.yaml
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}

      # dependencies are installed with pnpm; the packages are still published
      # with npm (source/build/publish-packages.mjs: source/dist, dist-vue and
      # dist-angular, all at the same version)
      - name: Upgrade npm (required for OIDC trusted publishing)
        run: |
          npm i -g npm@^11.5.1
          npm --version

      - uses: './.github/actions/will-release-check'

      - name: Echo publish cmd
        run: echo $WILL_RELEASE_CMD

      - name: Set git config
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "SHIP IT"

      # the root's postinstall installs every folder (scripts/install-all.mjs),
      # each from its own pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Get installed Playwright version
        id: playwright-version
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
        working-directory: examples

      - name: Restore cached browser binaries for Playwright
        id: playwright-restore
        uses: actions/cache/restore@v5
        with:
          path: '~/.cache/ms-playwright'
          key: '${{ runner.os }}-playwright-${{ steps.playwright-version.outputs.version }}'

      - name: Install Playwright browsers
        # this will not download anything if the previous step found a cached browser binary
        run: pnpm exec playwright install chromium
        working-directory: examples
        env:
          CI: true

      - name: Install Playwright system dependencies
        # Chromium's apt packages. On the runner image its libraries are already installed and only
        # fonts are missing, and the tests do not compare screenshots, so an unreachable Ubuntu
        # mirror (a DNS outage failed two release runs) must not fail the job
        continue-on-error: true
        run: pnpm exec playwright install-deps chromium
        working-directory: examples
        env:
          CI: true

      - name: Build component # in the www folder, some CSS files are used from the source/dist folder
        run: pnpm run build

      - name: Build test app
        run: pnpm run ci:test:build
        env:
          NEXT_PUBLIC_INFINITE_LICENSE_KEY: ${{ secrets.NEXT_PUBLIC_INFINITE_LICENSE_KEY }}

      - name: Running Playwright Tests
        run: pnpm run ci:test:run

      - name: Save browser binaries for Playwright
        id: playwright-save
        uses: actions/cache/save@v5
        with:
          path: '~/.cache/ms-playwright'
          key: '${{ runner.os }}-playwright-${{ steps.playwright-version.outputs.version }}'

      # - name: Linting
      #   run: npm run lint
      #   working-directory: source

      - name: Update TOC in markdown files
        run: pnpm run doctoc

      - name: Bump version
        working-directory: source
        run: npm run bump:${WILL_RELEASE_VERSION}

      - name: Building
        run: pnpm run build

      - name: Ship it
        uses: './.github/actions/execute-cmd'
        with:
          cmd_to_execute: $WILL_RELEASE_CMD

      - run: git diff
      - run: cat package.json
        working-directory: source

      - name: Push changes
        uses: './.github/actions/git-push-action'
        with:
          branch: ${{ github.ref_name }}
          github_token: ${{ secrets.DEPLOY_GITHUB_TOKEN }}

      # - name: Send version to slack
      #   uses: "./.github/actions/send-version-to-slack"
      #   with:
      #     slack_webhook_notify: ${{ secrets.SLACK_WEBHOOK_NOTIFY }}
  publish-docs-on-release:
    needs: release
    name: 'Rebuilds website'
    uses: ./.github/workflows/rebuild-website.yml
    secrets: inherit
