# Used by the site built from infinite-table/infinite-www-dist: the
# "Rebuild website" workflow builds the docs in GitHub Actions and pushes the
# `www` folder and this file there.
#
# Netlify then only needs the node modules that the functions leave external
# (see `external_node_modules`): it installs `www` from its pnpm-lock.yaml
# (www/pnpm-workspace.yaml keeps node_modules flat). This command overrides
# the one in the Netlify UI.
[build]
  command = "cd www && npx --yes pnpm@10.28.1 install --frozen-lockfile && npm run install-serverless-deps"

[functions]
  directory = "www/functions"
  node_bundler = "esbuild"
  included_files = ["www/dataserver/data/**.json"]
  external_node_modules = ["express", "serverless-http", "path", "cors", "body-parser", "json-server","fs","net","tls","request","xlsx","alasql","@adaptabletools/infinite-license","busboy","axios"]

[[headers]]
  for = "/*"
  [headers.values]
  cache-control = "no-store"
[[headers]]
  for = "*.css"
  [headers.values]
    cache-control = '''
    public,
    max-age=31536000,
    immutable'''
[[headers]]
  # everything Next emits under /_next/static is content-hashed (chunks, css,
  # and the next/font .woff2 files in /_next/static/media), so it can be cached
  # forever. Without this the fonts fell under "/*" = no-store and were
  # downloaded again on every reload, showing the fallback font first.
  for = "/_next/static/*"
  [headers.values]
    cache-control = '''
    public,
    max-age=31536000,
    immutable'''
[[headers]]
  for = "*.js"
  [headers.values]
    cache-control = '''
    public,
    max-age=31536000,
    immutable'''
[[headers]]
  # docs demo editor: esbuild-wasm, content-hashed by the docs-kit demo build
  for = "*.wasm"
  [headers.values]
    content-type = "application/wasm"
    cache-control = '''
    public,
    max-age=31536000,
    immutable'''
